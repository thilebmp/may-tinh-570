<style>
/* Layout: one-screen instrument. LCD panel on top, eight key rows below (1 control, 3 function, 4 numeric). */
:root{
  --bg:#E3E8ED; --ink:#17212B;
  --lcd:#C8D5C4; --lcd-ink:#141D17; --lcd-dim:#566557; --lcd-line:#AFBEAB;
  --k-num:#FFFFFF; --k-num-ink:#17212B;
  --k-fn:#2A3948; --k-fn-ink:#EEF2F5;
  --k-op:#C6D0DA; --k-op-ink:#17212B;
  --k-del:#C2513A; --k-del-ink:#FFFFFF;
  --k-eq:#0C7774; --k-eq-ink:#FFFFFF;
  --sh-fn:#62D6D0; --al-fn:#F5AA6C; --sh-lt:#0A7C79; --al-lt:#B8581A;
  --edge:rgba(23,33,43,.14); --focus:#0C7774;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-lcd:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171D; --ink:#E8EDF1;
  --lcd:#B5C3AF; --lcd-ink:#101812; --lcd-dim:#4C5A4D; --lcd-line:#9DAD99;
  --k-num:#2C3743; --k-num-ink:#F2F5F8;
  --k-fn:#1A222B; --k-fn-ink:#D6DDE4;
  --k-op:#3D4B5A; --k-op-ink:#F2F5F8;
  --k-del:#B8492F; --k-del-ink:#FFFFFF;
  --k-eq:#12918D; --k-eq-ink:#FFFFFF;
  --sh-fn:#62D6D0; --al-fn:#F5AA6C; --sh-lt:#62D6D0; --al-lt:#F5AA6C;
  --edge:rgba(255,255,255,.09); --focus:#62D6D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171D; --ink:#E8EDF1;
  --lcd:#B5C3AF; --lcd-ink:#101812; --lcd-dim:#4C5A4D; --lcd-line:#9DAD99;
  --k-num:#2C3743; --k-num-ink:#F2F5F8;
  --k-fn:#1A222B; --k-fn-ink:#D6DDE4;
  --k-op:#3D4B5A; --k-op-ink:#F2F5F8;
  --k-del:#B8492F; --k-del-ink:#FFFFFF;
  --k-eq:#12918D; --k-eq-ink:#FFFFFF;
  --sh-fn:#62D6D0; --al-fn:#F5AA6C; --sh-lt:#62D6D0; --al-lt:#F5AA6C;
  --edge:rgba(255,255,255,.09); --focus:#62D6D0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);display:flex;justify-content:center;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.calc{width:100%;max-width:420px;height:100%;max-height:840px;margin:auto;display:flex;flex-direction:column;gap:10px;min-height:0}

.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:8px 12px 10px;font-family:var(--f-lcd);
  display:flex;flex-direction:column;gap:2px;min-height:182px;box-shadow:inset 0 1px 4px rgba(0,0,0,.22);flex:0 0 auto;min-width:0}
.ind{display:flex;gap:8px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--lcd-dim);min-height:15px;align-items:center}

#aux{font-size:13px;overflow:auto;max-height:104px;-webkit-overflow-scrolling:touch}
#aux.tall{max-height:38vh}
.form{color:var(--lcd-dim);font-size:12px;margin-bottom:3px}
.coefs{display:grid;gap:2px 8px}
.coefs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;border-radius:3px;font-variant-numeric:tabular-nums}
.coefs .on{background:var(--lcd-ink);color:var(--lcd)}
table.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tb th{position:sticky;top:0;background:var(--lcd);text-align:right;font-weight:600;color:var(--lcd-dim);border-bottom:1px solid var(--lcd-line);padding:2px 6px}

.bx{display:inline-block;width:.5em;height:.72em;border:1px dashed var(--lcd-dim);vertical-align:-.05em;margin:0 1px}
.f2{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.25;margin:0 2px}

.rt .rb{border-top:1.5px solid var(--lcd-ink);padding:0 3px 0 1px;line-height:1.35}
sup.pw,sup.ix{font-size:.68em;vertical-align:.7em;line-height:1}
sup.ix{margin-right:-3px}
sub.sb{font-size:.68em;vertical-align:-.45em;line-height:1}
.ab{border-left:1.5px solid var(--lcd-ink);border-right:1.5px solid var(--lcd-ink);padding:0 3px;margin:0 2px}
.ig{font-size:1.5em;vertical-align:middle;line-height:1}
.lim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1.5;margin-right:3px}
@keyframes bl{50%{opacity:0}}

#res{margin-top:auto;text-align:right;font-size:34px;font-weight:500;line-height:46px;min-height:46px;white-space:nowrap;overflow-x:auto;font-variant-numeric:tabular-nums}
#res.sm{font-size:20px}
#res sup{font-size:.55em;vertical-align:.75em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.56em;line-height:1.15;text-align:center}
.fr span+span{border-top:2px solid var(--lcd-ink)}

.keys{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;grid-template-columns:repeat(6,minmax(0,1fr));flex:.86;min-height:0}
.top{display:grid;gap:6px;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:1fr 1fr;flex:1.75;min-height:0}
.dpad{grid-column:3/5;grid-row:1/3;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:3px;min-height:0;
  background:var(--k-fn);border:1px solid var(--edge);border-radius:16px;padding:4px}
.dpad .k{border:0;border-radius:7px;justify-content:center;padding:0;background:var(--k-op);color:var(--k-op-ink)}
.dpad .k .m{font-size:12px;line-height:14px}
#k-up{grid-area:1/2}#k-left{grid-area:2/1}#k-right{grid-area:2/3}#k-down{grid-area:3/2}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:15px;line-height:22px;cursor:pointer;padding-top:4px}
.menu.one{grid-template-columns:1fr}
#k-frac .m{font-size:20px}
.menu .off{color:var(--lcd-dim)}
.row.n{grid-template-columns:repeat(5,minmax(0,1fr));flex:1}
.k{appearance:none;border:1px solid var(--edge);border-radius:9px;margin:0;padding:1px 2px 3px;font-family:var(--f-ui);font-weight:500;
  background:var(--k-fn);color:var(--k-fn-ink);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;min-width:0;min-height:0;
  cursor:pointer;touch-action:manipulation;transition:transform .05s,filter .05s}
.k .sub{display:flex;justify-content:space-between;font-size:10px;line-height:12px;font-weight:600;padding:0 3px;min-height:12px;white-space:nowrap}
.k .sub .s{color:var(--sh-fn)} .k .sub .a{color:var(--al-fn);margin-left:auto}
.k .m{font-size:15px;line-height:20px;text-align:center;white-space:nowrap}
.k .m sup,.k .sub sup{font-size:.7em;vertical-align:.5em;line-height:0}
.k.num,.k.op,.k.del,.k.eq{justify-content:center}
.k.num{background:var(--k-num);color:var(--k-num-ink)} .k.num .m{font-size:22px;line-height:26px}
.k.op{background:var(--k-op);color:var(--k-op-ink)} .k.op .m{font-size:22px;line-height:26px}
.k.num .sub .s,.k.op .sub .s{color:var(--sh-lt)} .k.num .sub .a,.k.op .sub .a{color:var(--al-lt)}
.k.num.e10 .m{font-size:16px;line-height:22px}
.k.del{background:var(--k-del);color:var(--k-del-ink)} .k.del .m{font-size:17px;font-weight:600}
.k.eq{background:var(--k-eq);color:var(--k-eq-ink)} .k.eq .m{font-size:24px}
.k.sh .m{color:var(--sh-fn);font-weight:600;font-size:13px} .k.al .m{color:var(--al-fn);font-weight:600;font-size:13px}
.k.ctl{justify-content:center} .k.ctl .m{font-size:13px}
.k.lit{outline:2px solid var(--focus);outline-offset:-2px}
.k.dn{transform:scale(.95);filter:brightness(.86)}
.k:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:6px;z-index:2;overflow:auto}
.sheet h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:4px 2px 0;opacity:.7}
.sheet button{appearance:none;border:1px solid var(--edge);border-radius:9px;background:var(--k-num);color:var(--k-num-ink);
  font:500 15px var(--f-ui);text-align:left;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sheet button small{font:400 12px var(--f-lcd);opacity:.65;margin-left:auto}
.sheet button.sel{background:var(--k-eq);color:var(--k-eq-ink);border-color:transparent}
.sheet .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sheet .seg button{justify-content:center}
.sheet .x{background:var(--k-fn);color:var(--k-fn-ink);justify-content:center;margin-top:auto}
</style>

<body>


<div class="calc">
  <div class="lcd" aria-live="polite">
    <div class="ind" id="ind"></div>
    <div id="aux" hidden></div>
    <div id="prompt"></div>
    <div id="expr"></div>
    <div id="res"></div>
  </div>
  <div class="keys" id="keys"></div>
</div>

<script>
(function(){
'use strict';
const VARS=['A','B','C','D','E','F','X','Y','M'];
/* natural-display templates live in the flat token list as OPEN … | … } */
const OPEN={'F{':2,'M{':3,'R{':1,'R3{':1,'RN{':2,'^{':1,'LB{':2,'A{':1,'I{':3,'D{':2};
const TPL={
  frac:{m:['F{','|','}'],l:['⌟']},mixed:{m:['M{','|','|','}'],l:['⌟']},
  sqrt:{m:['R{','}'],l:['√(']},cbrt:{m:['R3{','}'],l:['³√(']},nroot:{m:['RN{','|','}'],l:['ˣ√(']},
  pow:{m:['^{','}'],l:['^(']},p10:{m:['1','0','^{','}'],l:['10^('],c:3},pe:{m:['e','^{','}'],l:['e^('],c:2},
  logab:{m:['LB{','|','}'],l:['log(']},abs:{m:['A{','}'],l:['Abs(']},
  int:{m:['I{','|','|','}'],l:['∫(']},ddx:{m:['D{','|','}'],l:['d/dx(']}
};
function CalcErr(k){this.k=k}
const MATH=()=>{throw new CalcErr('math')};

const S={tok:[],cur:0,shift:false,alpha:false,pend:null,done:false,out:null,frac:false,err:null,note:'',
  ang:'D',io:'M',ask:null,menu:null,mode:'comp',ans:0,vars:{A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0},hist:[],hi:0,eqn:null,tbl:null};

/* ---------- numeric helpers ---------- */
const sig=(v,n)=>v===0||!isFinite(v)?v:Number(v.toPrecision(n));
function toFrac(x){
  if(!isFinite(x)||Number.isInteger(x))return null;
  const s=x<0?-1:1,a=Math.abs(x); if(a>1e9||a<1e-9)return null;
  let h0=0,h1=1,k0=1,k1=0,r=a;
  for(let i=0;i<32;i++){
    const q=Math.floor(r),h=q*h1+h0,k=q*k1+k0; h0=h1;h1=h;k0=k1;k1=k;
    if(k>999999)return null;
    if(Math.abs(a-h/k)<=1e-12*Math.max(1,a)){
      if(k===1||(''+h).length+(''+k).length>10)return null;
      return {n:s*h,d:k};
    }
    const f=r-q; if(f<1e-13)return null; r=1/f;
  }
  return null;
}
function pow(b,e){
  if(b===0&&e<=0)MATH();
  if(b<0&&!Number.isInteger(e)){
    const fr=toFrac(e);
    if(fr&&fr.d%2===1){const r=Math.pow(-b,e);return fr.n%2?-r:r}
    MATH();
  }
  return Math.pow(b,e);
}
function fact(n){if(!Number.isInteger(n)||n<0||n>69)MATH();let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function nPrC(n,r,k){
  if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r)MATH();
  let v=1;
  if(k==='P'){for(let i=0;i<r;i++)v*=n-i}
  else{const m=Math.min(r,n-r);for(let i=1;i<=m;i++)v=v*(n-m+i)/i;v=Math.round(v)}
  return v;
}
const AU=()=>S.ang==='D'?Math.PI/180:S.ang==='G'?Math.PI/200:1;
const zr=(v,x)=>Math.abs(v)<1e-14&&Math.abs(x)>1e-9?0:v;
const FN={
  'sin(':x=>zr(Math.sin(x*AU()),x),
  'cos(':x=>zr(Math.cos(x*AU()),1),
  'tan(':x=>{const r=x*AU(),c=zr(Math.cos(r),1);if(c===0)MATH();return zr(Math.sin(r),x)/c},
  'sin⁻¹(':x=>{if(x<-1||x>1)MATH();return Math.asin(x)/AU()},
  'cos⁻¹(':x=>{if(x<-1||x>1)MATH();return Math.acos(x)/AU()},
  'tan⁻¹(':x=>Math.atan(x)/AU(),
  'log(':x=>{if(x<=0)MATH();return Math.log10(x)},
  'ln(':x=>{if(x<=0)MATH();return Math.log(x)},
  '√(':x=>{if(x<0)MATH();return Math.sqrt(x)},
  '³√(':x=>Math.cbrt(x),
  'Abs(':x=>Math.abs(x),
  '10^(':x=>Math.pow(10,x),
  'e^(':x=>Math.exp(x),
  'sinh(':x=>Math.sinh(x),'cosh(':x=>Math.cosh(x),'tanh(':x=>Math.tanh(x),
  'sinh⁻¹(':x=>Math.asinh(x),
  'cosh⁻¹(':x=>{if(x<1)MATH();return Math.acosh(x)},
  'tanh⁻¹(':x=>{if(x<=-1||x>=1)MATH();return Math.atanh(x)}
};
function withX(f,body){
  const old=S.vars.X;
  try{return body(x=>{S.vars.X=x;const v=f();if(!isFinite(v))MATH();return v})}
  finally{S.vars.X=old}
}
function integ(f,a,b){
  return withX(f,g=>{
    if(a===b)return 0;
    const n=2000,h=(b-a)/n;let s=g(a)+g(b);
    for(let i=1;i<n;i++)s+=g(a+i*h)*(i%2?4:2);
    return sig(s*h/3,12);
  });
}
function deriv(f,a){
  return withX(f,g=>{
    const h=Math.max(Math.abs(a),1)*1e-3;
    const v=(-g(a+2*h)+8*g(a+h)-8*g(a-h)+g(a-2*h))/(12*h);
    return Math.abs(v)<1e-11?0:sig(v,10);
  });
}

/* ---------- parser: token list -> thunk ---------- */
function compile(t){
  let p=0;
  const SYN=()=>{throw new CalcErr('syn')};
  const isD=k=>k!==undefined&&/^[0-9]$/.test(k);
  const isN=k=>isD(k)||k==='.';
  const starts=k=>k!==undefined&&(isN(k)||k==='('||k==='π'||k==='e'||k==='Ans'||VARS.includes(k)||k in FN||k==='∫('||k==='d/dx('||k==='Ran#'||(k in OPEN&&k!=='^{'));
  function close(){if(p>=t.length||t[p]==='|'||t[p]==='}')return;if(t[p]===')'){p++;return}SYN()}
  function comma(){if(t[p]===','){p++;return}SYN()}
  function expr(){
    let l=term();
    for(;;){
      const k=t[p];
      if(k==='+'){p++;const a=l,b=term();l=()=>a()+b()}
      else if(k==='−'){p++;const a=l,b=term();l=()=>a()-b()}
      else return l;
    }
  }
  function term(){
    let l=perm();
    for(;;){
      const k=t[p];
      if(k==='×'){p++;const a=l,b=perm();l=()=>a()*b()}
      else if(k==='÷'){p++;const a=l,b=perm();l=()=>{const d=b();if(d===0)MATH();return a()/d}}
      else if(starts(k)){const a=l,b=perm();l=()=>a()*b()}
      else return l;
    }
  }
  function perm(){
    let l=frac();
    for(;;){
      const k=t[p];
      if(k==='P'||k==='C'){p++;const a=l,b=frac();l=()=>nPrC(a(),b(),k)}
      else return l;
    }
  }
  function frac(){
    const q=[unary()];
    while(t[p]==='⌟'){p++;q.push(unary())}
    if(q.length===1)return q[0];
    if(q.length===2)return()=>{const d=q[1]();if(d===0)MATH();return q[0]()/d};
    if(q.length===3)return()=>{const w=q[0](),d=q[2]();if(d===0)MATH();const f=q[1]()/d;return w<0?w-f:w+f};
    SYN();
  }
  function unary(){
    const k=t[p];
    if(k==='−'||k==='±'){p++;const f=unary();return()=>-f()}
    if(k==='+'){p++;return unary()}
    return postfix();
  }
  function postfix(){
    let b=primary();
    for(;;){
      const k=t[p],a=b;
      if(k==='²'){p++;b=()=>{const v=a();return v*v}}
      else if(k==='³'){p++;b=()=>{const v=a();return v*v*v}}
      else if(k==='⁻¹'){p++;b=()=>{const v=a();if(v===0)MATH();return 1/v}}
      else if(k==='!'){p++;b=()=>fact(a())}
      else if(k==='%'){p++;b=()=>a()/100}
      else if(k==='^{'){p++;const e=expr();if(t[p]!=='}')SYN();p++;b=()=>pow(a(),e())}
      else if(k==='^('){p++;const e=expr();close();b=()=>pow(a(),e())}
      else if(k==='ˣ√('){p++;const e=expr();close();b=()=>{const n=a();if(n===0)MATH();return pow(e(),1/n)}}
      else return b;
    }
  }
  function primary(){
    const k=t[p];
    if(k===undefined)SYN();
    if(isN(k)){
      let s='';
      while(isN(t[p]))s+=t[p++];
      if(t[p]==='ᴇ'){
        p++;s+='e';
        if(t[p]==='−'||t[p]==='±'){p++;s+='-'}else if(t[p]==='+')p++;
        let d='';while(isD(t[p]))d+=t[p++];
        if(!d)SYN();s+=d;
      }
      if(!/^(\d+\.?\d*|\.\d+)(e-?\d+)?$/.test(s))SYN();
      const v=parseFloat(s);return()=>v;
    }
    p++;
    if(k==='('){const e=expr();close();return e}
    if(k==='π')return()=>Math.PI;
    if(k==='e')return()=>Math.E;
    if(k==='Ans')return()=>S.ans;
    if(VARS.includes(k))return()=>S.vars[k];
    if(k==='∫('){const f=expr();comma();const a=expr();comma();const b=expr();close();return()=>integ(f,a(),b())}
    if(k==='d/dx('){const f=expr();comma();const a=expr();close();return()=>deriv(f,a())}
    if(k in OPEN&&k!=='^{'){
      const s=[expr()];while(t[p]==='|'){p++;s.push(expr())}
      if(t[p]!=='}'||s.length!==OPEN[k])SYN();
      p++;
      switch(k){
        case 'F{':return()=>{const d=s[1]();if(d===0)MATH();return s[0]()/d};
        case 'M{':return()=>{const w=s[0](),d=s[2]();if(d===0)MATH();const f=s[1]()/d;return w<0?w-f:w+f};
        case 'R{':return()=>FN['√('](s[0]());

        case 'RN{':return()=>{const n=s[0]();if(n===0)MATH();return pow(s[1](),1/n)};
        case 'A{':return()=>Math.abs(s[0]());
        case 'I{':return()=>integ(s[0],s[1](),s[2]());
        case 'D{':return()=>deriv(s[0],s[1]());

      }

      close();return()=>FN['log('](a());
    }
    if(k in FN){const e=expr();close();const fn=FN[k];return()=>fn(e())}

}
function evalTok(t){
  const v=compile(t)();

}

/* ---------- formatting ---------- */
function fmt(x){
  if(x===0)return '0';
  const a=Math.abs(x);
  if(a>=1e10||a<1e-9){
    let [m,e]=x.toExponential(9).split('e');
    m=m.replace(/0+$/,'').replace(/\.$/,'');
    return m+'×10<sup>'+(+e)+'</sup>';
  }
  const dec=Math.max(0,Math.min(20,9-Math.floor(Math.log10(a))));
  let s=x.toFixed(dec);
  if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s==='-0'?'0':s;
}
function fmtV(v,frac){
  if(frac){const f=toFrac(v);if(f)return (f.n<0?'-':'')+'<span class="fr"><span>'+Math.abs(f.n)+'</span><span>'+f.d+'</span></span>'}
  return fmt(v);
}
function fmtC(re,im,frac){
  if(im===0)return fmtV(re,frac);
  return (re!==0?fmt(re):'')+(im<0?'−':(re!==0?'+':''))+(Math.abs(im)===1?'':fmt(Math.abs(im)))+'i';
}
const DISP={'±':'-','P':'𝐏','C':'𝐂','Eq':'='};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const frH=(n,d)=>'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
/* exact form of a result (fraction, multiple of π, single surd) or null */
function exact(v,tk){
  if(!isFinite(v)||Number.isInteger(v)||tk.includes('.'))return null;
  const lin=S.io==='L',sg=v<0?'-':'',f=toFrac(v);
  if(f)return sg+(lin?Math.abs(f.n)+'⌟'+f.d:frH(Math.abs(f.n),f.d));
  if(lin)return null;
  if(tk.includes('π')||(S.ang==='R'&&tk.some(k=>/⁻¹\($/.test(k)))){
    const q=Math.abs(v)/Math.PI,qi=sig(q,12);let n=0,d=1;
    if(Number.isInteger(qi))n=qi;else{const g=toFrac(q);if(g&&g.d<=360){n=g.n;d=g.d}}
    if(n&&n<10000){const top=(n===1?'':n)+'π';return sg+(d===1?top:frH(top,d))}
  }
  const s=sig(v*v,12);let n=0,d=1;
  if(Number.isInteger(s))n=s;else{const g=toFrac(s);if(g){n=g.n;d=g.d}}
  if(n&&n*d<1e7){
    const N=n*d;let a=1;
    for(let i=Math.floor(Math.sqrt(N));i>1;i--)if(N%(i*i)===0){a=i;break}
    const b=N/(a*a);if(b===1)return null;
    const g=gcd(a,d);a/=g;const den=d/g;
    if(a<1000&&den<1000&&b<10000){const top=(a===1?'':a)+'√'+b;return sg+(den===1?top:frH(top,den))}
  }
  return null;
}
/* 2-D drawing of a token list; cur = cursor index or -1 */
function draw(t,cur){
  let i=0;
  const CUR='<i class="cur"></i>',BX='<span class="bx"></span>';
  const f2=(a,b)=>'<span class="f2"><span>'+a+'</span><span>'+b+'</span></span>';
  const rt=x=>'<span class="rt"><span>√</span><span class="rb">'+x+'</span></span>';
  function seq(top){
    let h='',n=0;
    for(;;){
      if(i===cur)h+=CUR;
      const k=t[i];
      if(k===undefined||((k==='|'||k==='}')&&!top))break;
      n++;
      if(k in OPEN)h+=struct(k);else{h+=DISP[k]||k;i++}
    }
    return n||top?h:h+BX;
  }
  function struct(k){
    i++;const s=[seq()];
    while(t[i]==='|'){i++;s.push(seq())}
    if(t[i]==='}')i++;
    while(s.length<OPEN[k])s.push(BX);
    switch(k){
      case 'F{':return f2(s[0],s[1]);
      case 'M{':return s[0]+f2(s[1],s[2]);
      case 'R{':return rt(s[0]);
      case 'R3{':return '<sup class="ix">3</sup>'+rt(s[0]);
      case 'RN{':return '<sup class="ix">'+s[0]+'</sup>'+rt(s[1]);
      case '^{':return '<sup class="pw">'+s[0]+'</sup>';
      case 'LB{':return 'log<sub class="sb">'+s[0]+'</sub>('+s[1]+')';
      case 'A{':return '<span class="ab">'+s[0]+'</span>';
      case 'I{':return '<span class="ig">∫</span><span class="lim"><span>'+s[2]+'</span><span>'+s[1]+'</span></span>'+s[0]+'dx';
      default:return f2('d','dx')+'('+s[0]+')<sub class="sb">x='+s[1]+'</sub>';
    }
  }
  return seq(true);
}

/* ---------- equation solving ---------- */
const cl=v=>Math.abs(v)<1e-11?0:sig(v,14);
const EQ={
  s2:{name:'Hệ 2 ẩn',form:'a·x + b·y = c',cols:3,lab:['a₁','b₁','c₁','a₂','b₂','c₂']},
  s3:{name:'Hệ 3 ẩn',form:'a·x + b·y + c·z = d',cols:4,lab:['a₁','b₁','c₁','d₁','a₂','b₂','c₂','d₂','a₃','b₃','c₃','d₃']},
  q2:{name:'Bậc 2',form:'aX² + bX + c = 0',cols:3,lab:['a','b','c']},
  q3:{name:'Bậc 3',form:'aX³ + bX² + cX + d = 0',cols:4,lab:['a','b','c','d']}
};
function linSolve(n,v){
  const m=[];for(let i=0;i<n;i++)m.push(v.slice(i*(n+1),(i+1)*(n+1)));
  for(let c=0;c<n;c++){
    let pv=c;for(let r=c+1;r<n;r++)if(Math.abs(m[r][c])>Math.abs(m[pv][c]))pv=r;
    if(Math.abs(m[pv][c])<1e-12)return null;
    [m[c],m[pv]]=[m[pv],m[c]];
    for(let r=0;r<n;r++)if(r!==c){const f=m[r][c]/m[c][c];for(let k=c;k<=n;k++)m[r][k]-=f*m[c][k]}
  }
  return m.map((r,i)=>cl(r[n]/r[i]));
}
function solveEq(type,v){
  if(type==='s2'||type==='s3'){
    const n=type==='s2'?2:3,r=linSolve(n,v);
    if(!r)return [{msg:'Vô nghiệm hoặc vô số nghiệm'}];
    return r.map((x,i)=>({name:'XYZ'[i],re:x,im:0}));
  }
  if(v[0]===0)MATH();
  if(type==='q2'){
    const [a,b,c]=v,d=b*b-4*a*c;
    if(d>0){const s=Math.sqrt(d);return [{name:'X₁',re:cl((-b+s)/(2*a)),im:0},{name:'X₂',re:cl((-b-s)/(2*a)),im:0}]}
    if(d===0)return [{name:'X',re:cl(-b/(2*a)),im:0}];
    const re=cl(-b/(2*a)),im=cl(Math.sqrt(-d)/(2*Math.abs(a)));
    return [{name:'X₁',re,im},{name:'X₂',re,im:-im}];
  }
  let [a,b,c,d]=v;b/=a;c/=a;d/=a;
  const p=c-b*b/3,q=2*b*b*b/27-b*c/3+d,sh=-b/3,disc=q*q/4+p*p*p/27;
  const tol=1e-12*Math.max(1,q*q/4,Math.abs(p*p*p/27));
  let r;
  if(Math.abs(disc)<=tol){
    if(Math.abs(p)<1e-12)r=[[0,0],[0,0],[0,0]];
    else{const t1=3*q/p,t2=-3*q/(2*p);r=[[t1,0],[t2,0],[t2,0]]}
  }else if(disc>0){
    const s=Math.sqrt(disc),u=Math.cbrt(-q/2+s),w=Math.cbrt(-q/2-s),i3=Math.sqrt(3)/2*(u-w);
    r=[[u+w,0],[-(u+w)/2,i3],[-(u+w)/2,-i3]];
  }else{
    const m=2*Math.sqrt(-p/3),ph=Math.acos(Math.max(-1,Math.min(1,3*q/(p*m))));
    r=[0,1,2].map(k=>[m*Math.cos((ph-2*Math.PI*k)/3),0]);
  }
  return r.map(([re,im],i)=>({name:'X'+'₁₂₃'[i],re:cl(re+sh),im:cl(im)}));
}

/* ---------- actions ---------- */
const POSTOPS=['+','−','×','÷','²','³','⁻¹','!','%','^(','⌟','P','C','ˣ√('];
function clearOut(){S.out=null;S.err=null;S.note='';S.done=false}
function insert(k){
  if(S.eqn&&S.eqn.phase==='out')return;
  if(S.tbl&&S.tbl.step===4)return;
  if(S.done){S.ask=null;S.tok=POSTOPS.includes(k)?['Ans']:[];S.cur=S.tok.length}
  clearOut();
  S.tok.splice(S.cur,0,k);S.cur++;
}
function insertT(name){
  const d=TPL[name];
  if(S.io==='L'){d.l.forEach(insert);return}
  if(S.eqn&&S.eqn.phase==='out')return;
  if(S.tbl&&S.tbl.step===4)return;
  if(S.done){S.ask=null;S.tok=name==='pow'?['Ans']:[];S.cur=S.tok.length}
  clearOut();
  S.tok.splice(S.cur,0,...d.m);S.cur+=d.c||1;
}
function delBack(){
  const k=S.tok[S.cur-1];
  if(!(k in OPEN)&&k!=='|'&&k!=='}'){S.tok.splice(S.cur-1,1);S.cur--;return}
  const st=[];let marks=null;
  S.tok.forEach((x,i)=>{
    if(x in OPEN)st.push([i]);
    else if(x==='|'&&st.length)st[st.length-1].push(i);
    else if(x==='}'){const m=st.pop();if(m){m.push(i);if(m.includes(S.cur-1))marks=m}}
  });
  if(!marks)marks=[S.cur-1];
  const before=marks.filter(i=>i<S.cur).length;
  for(let j=marks.length-1;j>=0;j--)S.tok.splice(marks[j],1);
  S.cur-=before;
}
/* CALC / SOLVE: prompt for each variable, then evaluate or solve */
function askStart(kind){
  if(S.mode!=='comp'){S.note='Chỉ dùng trong COMP';return}
  if(S.ask&&S.ask.phase==='out'&&S.ask.kind===kind&&S.done){askEquals();return}
  if(!S.tok.length)return;
  const ex=S.tok.slice(),q=ex.indexOf('Eq');let L,R;
  try{
    if(q>=0&&kind==='calc')throw new CalcErr('syn');
    L=compile(q>=0?ex.slice(0,q):ex);R=q>=0?compile(ex.slice(q+1)):()=>0;
  }catch(e){S.err='syn';S.out=null;return}
  let vars=VARS.filter(v=>ex.includes(v)),target=null;
  if(kind==='solve'){
    target=vars.includes('X')?'X':vars[0];
    if(!target){S.err='syn';S.out=null;return}
    vars=vars.filter(v=>v!==target).concat(target);
  }else if(!vars.length){S.ask=null;S.done=false;return equals()}
  clearOut();
  S.ask={kind,ex,L,R,vars,target,i:0,phase:'in',lr:0,msg:null};S.tok=[];S.cur=0;
}
function askEquals(){
  const a=S.ask;
  if(a.phase==='out'){a.phase='in';a.i=0;S.tok=[];S.cur=0;S.out=null;S.done=false;return}
  if(S.tok.length){const v=calc();if(v===null)return;S.vars[a.vars[a.i]]=v}
  S.tok=[];S.cur=0;a.i++;
  if(a.i<a.vars.length)return;
  S.tok=a.ex.slice();S.cur=S.tok.length;S.done=true;a.phase='out';a.msg=null;
  try{
    if(a.kind==='calc'){
      const v=a.L();if(!isFinite(v)||Math.abs(v)>=1e100)MATH();
      const r=sig(v,14);S.ans=r;S.out={v:r,ex:exact(r,a.ex)};S.frac=!!S.out.ex;pushHist();
    }else solveFor(a);
  }catch(e){S.err=e instanceof CalcErr?e.k:'math';S.out=null}
}
function solveFor(a){
  const v=a.target,x0=S.vars[v];
  const g=x=>{S.vars[v]=x;const y=a.L()-a.R();if(!isFinite(y))MATH();return y};
  const run=x=>{
    try{
      for(let i=0;i<150;i++){
        const y=g(x);if(y===0)return x;
        const h=Math.max(Math.abs(x),1)*1e-6,d=(g(x+h)-g(x-h))/(2*h);
        if(d===0||!isFinite(d))return null;
        const xn=x-y/d;
        if(!isFinite(xn))return null;
        if(Math.abs(xn-x)<=1e-11*Math.max(1,Math.abs(xn)))return Math.abs(g(xn))<1e-7?xn:null;
        x=xn;
      }
      return Math.abs(g(x))<1e-9?x:null;
    }catch(e){return null}
  };
  let r=null;
  for(const s of [x0,x0+1,x0-1,0,1,-1,10,-10,100,-100]){r=run(s);if(r!==null)break}
  if(r===null){S.vars[v]=x0;a.msg="Can't Solve";S.out={html:"Can't Solve",sm:true};return}
  r=Math.abs(r)<1e-12?0:sig(r,14);
  let lr=0;try{lr=g(r)}catch(e){}
  S.vars[v]=r;a.lr=Math.abs(lr)<1e-9?0:sig(lr,3);
  S.out={v:r,ex:exact(r,[])};S.frac=!!S.out.ex;
}
function calc(){
  try{return evalTok(S.tok)}catch(e){S.err=e instanceof CalcErr?e.k:'syn';S.out=null;return null}
}
function pushHist(){
  const j=S.tok.join('\u0001'),last=S.hist[S.hist.length-1];
  if(!last||last.join('\u0001')!==j)S.hist.push(S.tok.slice());
  if(S.hist.length>30)S.hist.shift();
  S.hi=S.hist.length;
}
function equals(){
  S.err=null;S.note='';

  if(S.mode==='eqn')return eqEquals();
  if(S.mode==='tbl')return tbEquals();
  if(!S.tok.length||S.done)return;
  const v=calc();if(v===null)return;
  S.ans=v;S.out={v,ex:exact(v,S.tok)};S.frac=!!S.out.ex;S.done=true;pushHist();

function eqEquals(){
  const q=S.eqn,n=EQ[q.type].lab.length;

    return;
  }
  if(S.tok.length){const v=calc();if(v===null)return;q.vals[q.idx]=v}
  else if(q.vals[q.idx]==null)q.vals[q.idx]=0;

    try{q.roots=solveEq(q.type,q.vals.map(x=>x||0));q.phase='out';q.ri=0;showRoot()}

function showRoot(){
  const r=S.eqn.roots[S.eqn.ri];

  if(r.im===0){S.out={v:r.re,ex:exact(r.re,[])};S.frac=!!S.out.ex}

const TB=[['f(X)=',null],['Start?',1],['End?',5],['Step?',1]];
function tbEquals(){
  const t=S.tbl;
  if(t.step===4){t.step=0;S.tok=t.f.slice();S.cur=S.tok.length;return}
  if(t.step===0){
    if(!S.tok.length)return;
    try{compile(S.tok)}catch(e){S.err='syn';return}
    t.f=S.tok.slice();
  }else{
    let v=TB[t.step][1];
    if(S.tok.length){v=calc();if(v===null)return}
    t.p[t.step]=v;
  }
  S.tok=[];S.cur=0;t.step++;
  if(t.step===4){
    const [,a,b,h]=t.p,cnt=Math.floor((b-a)/h+1e-9)+1;
    if(!(h>0)||b<a||cnt>60){S.err='math';t.step=1;return}
    const f=compile(t.f),old=S.vars.X;t.rows=[];
    for(let i=0;i<cnt;i++){
      const x=sig(a+i*h,12);S.vars.X=x;let y;
      try{y=f();if(!isFinite(y))y=null;else y=sig(y,14)}catch(e){y=null}

function setMode(m,type){

function mem(sgn){
  if(S.mode!=='comp')return;
  let v;
  if(S.tok.length&&!S.done){v=calc();if(v===null)return;S.ans=v;pushHist()}
  else if(S.out&&S.out.v!=null)v=S.out.v;else return;
  S.vars.M=sig(S.vars.M+sgn*v,14);S.out={v};S.frac=false;S.done=true;S.note=sgn>0?'M+':'M−';
}
function nav(d){
  if(S.eqn){
    if(S.eqn.phase==='in'){const n=EQ[S.eqn.type].lab.length;S.eqn.idx=(S.eqn.idx+d+n)%n;S.tok=[];S.cur=0}
    else{const n=S.eqn.roots.length;S.eqn.ri=(S.eqn.ri+d+n)%n;showRoot()}
    return;
  }
  if(S.tbl||!S.hist.length||(S.ask&&S.ask.phase==='in'))return;
  S.ask=null;
  S.hi=Math.max(0,Math.min(S.hist.length-1,S.hi+d));
  S.tok=S.hist[S.hi].slice();S.cur=S.tok.length;clearOut();
}

/* ---------- keys ---------- */

const KEYS=[
 ['t',[
  {id:'shift',m:'SHIFT',cls:'ctl sh'},{id:'alpha',m:'ALPHA',cls:'ctl al'},
  {pad:[{id:'up',m:'▲',a:'@up'},{id:'left',m:'◀',a:'@left'},{id:'right',m:'▶',a:'@right'},{id:'down',m:'▼',a:'@down'}]},

  {id:'calc',m:'CALC',a:'@calc',s:T('@solve','SOLVE'),al:T('Eq','=')},{id:'int',m:'∫dx',a:'#int',s:T('#ddx','d/dx'),al:T('@na',':')},
  {id:'inv',m:'x<sup>−1</sup>',a:'⁻¹',s:T('!','x!')},{id:'logab',m:'log<sub>▫</sub>▫',a:'#logab',s:T('@na','Σ')}]],
 ['',[
  {id:'frac',m:'▫⁄▫',a:'#frac',s:T('#mixed','▫▫⁄▫')},{id:'sqrt',m:'√',a:'#sqrt',s:T('#cbrt','³√')},
  {id:'sq',m:'x<sup>2</sup>',a:'²',s:T('³','x<sup>3</sup>')},{id:'pow',m:'x<sup>y</sup>',a:'#pow',s:T('#nroot','ˣ√')},
  {id:'log',m:'log',a:'log(',s:T('#p10','10<sup>x</sup>')},{id:'ln',m:'ln',a:'ln(',s:T('#pe','e<sup>x</sup>')}]],
 ['',[
  {id:'neg',m:'(−)',a:'±',s:T('@na','∠'),al:T('A')},{id:'dms',m:'°′″',a:'@na',s:T('@na','←'),al:T('B')},
  {id:'hyp',m:'hyp',a:'@hyp',s:T('#abs','Abs'),al:T('C')},{id:'sin',m:'sin',a:'sin(',s:T('sin⁻¹(','sin⁻¹'),al:T('D')},
  {id:'cos',m:'cos',a:'cos(',s:T('cos⁻¹(','cos⁻¹'),al:T('E')},{id:'tan',m:'tan',a:'tan(',s:T('tan⁻¹(','tan⁻¹'),al:T('F')}]],
 ['',[
  {id:'rcl',m:'RCL',a:'@rcl',s:T('@sto','STO')},{id:'eng',m:'ENG',a:'@na',s:T('@na','←')},
  {id:'lp',m:'(',a:'(',s:T('%')},{id:'rp',m:')',a:')',s:T(','),al:T('X')},
  {id:'sd',m:'S⇔D',a:'@sd',s:T('@na','⇔d/c'),al:T('Y')},{id:'mplus',m:'M+',a:'@mplus',s:T('@mminus','M−'),al:T('M')}]],
 ['n',[
  {id:'7',m:'7',a:'7',s:T('@na','CONST'),cls:'num'},{id:'8',m:'8',a:'8',s:T('@na','CONV'),cls:'num'},{id:'9',m:'9',a:'9',s:T('@na','CLR'),cls:'num'},
  {id:'del',m:'DEL',a:'@del',s:T('@na','INS'),cls:'del'},{id:'ac',m:'AC',a:'@ac',s:T('@na','OFF'),cls:'del'}]],
 ['n',[
  {id:'4',m:'4',a:'4',s:T('@na','MATRIX'),cls:'num'},{id:'5',m:'5',a:'5',s:T('@na','VECTOR'),cls:'num'},{id:'6',m:'6',a:'6',cls:'num'},
  {id:'mul',m:'×',a:'×',s:T('P','nPr'),cls:'op'},{id:'div',m:'÷',a:'÷',s:T('C','nCr'),cls:'op'}]],
 ['n',[
  {id:'1',m:'1',a:'1',s:T('@na','STAT'),cls:'num'},{id:'2',m:'2',a:'2',s:T('@na','CMPLX'),cls:'num'},{id:'3',m:'3',a:'3',s:T('@na','BASE'),cls:'num'},
  {id:'add',m:'+',a:'+',s:T('@na','Pol'),cls:'op'},{id:'sub',m:'−',a:'−',s:T('@na','Rec'),cls:'op'}]],
 ['n',[
  {id:'0',m:'0',a:'0',s:T('@na','Rnd'),cls:'num'},{id:'dot',m:'.',a:'.',s:T('Ran#'),cls:'num'},
  {id:'exp',m:'×10<sup>x</sup>',a:'ᴇ',s:T('π'),al:T('e'),cls:'num e10'},
  {id:'ans',m:'Ans',a:'Ans',s:T('@na','DRG▸'),cls:'num'},{id:'eq',m:'=',a:'@eq',cls:'eq'}]]
];
const KMAP={};
const $=id=>document.getElementById(id);
const keysEl=$('keys');
function mk(k){
    KMAP[k.id]=k;
    const b=document.createElement('button');
    b.type='button';b.id='k-'+k.id;b.className='k '+(k.cls||'');b.dataset.id=k.id;
    const sub=(k.s||k.al)?'<span class="sub">'+(k.s?'<span class="s">'+k.s.l+'</span>':'')+(k.al?'<span class="a">'+k.al.l+'</span>':'')+'</span>':'';
    b.innerHTML=sub+'<span class="m">'+k.m+'</span>';
    return b;
}
KEYS.forEach(([rc,ks])=>{
  const row=document.createElement('div');row.className=rc==='t'?'top':'row '+rc;
  ks.forEach(k=>{
    if(k.pad){const d=document.createElement('div');d.className='dpad';k.pad.forEach(x=>d.appendChild(mk(x)));row.appendChild(d)}
    else row.appendChild(mk(k));
  });
  keysEl.appendChild(row);
});
function press(id){
  const k=KMAP[id];if(!k)return;
  if(S.menu){
    if(/^[0-9]$/.test(id))pickMenu(id);
    else if(id==='ac'||id==='on'||id==='mode')S.menu=null;
    S.shift=S.alpha=false;return render();
  }
  if(id==='shift'){S.shift=!S.shift;S.alpha=false;S.pend=null;return render()}
  if(id==='alpha'){S.alpha=!S.alpha;S.shift=false;S.pend=null;return render()}
  let act;
  if(S.pend&&k.al&&VARS.includes(k.al.a)){const v=k.al.a;S.shift=S.alpha=false;useVar(v);S.pend=null;return render()}
  if(S.shift&&k.s)act=k.s.a;else if(S.alpha&&k.al)act=k.al.a;else act=k.a;
  S.shift=S.alpha=false;S.pend=null;
  if(act[0]==='@'&&act.length>1)CMD[act.slice(1)]();
  else if(act[0]==='#'&&act.length>1)insertT(act.slice(1));
  else insert(act);
  render();
}
keysEl.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.k');if(!b)return;
  e.preventDefault();b.classList.add('dn');setTimeout(()=>b.classList.remove('dn'),110);
  press(b.dataset.id);
});
keysEl.addEventListener('keydown',e=>{
  const b=e.target.closest('.k');
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();press(b.dataset.id)}
});
const KB={'*':'mul','/':'div','+':'add','-':'sub','.':'dot',',':null,'(':'lp',')':'rp','^':'pow','Enter':'eq','=':'eq','Backspace':'del','Escape':'ac','ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up'};
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();return press(e.key)}
  if(e.key===','){e.preventDefault();insert(',');return render()}
  if(e.key==='ArrowDown'){e.preventDefault();CMD.down();return render()}
  if(KB[e.key]){e.preventDefault();press(KB[e.key])}
});

/* ---------- mode sheet ---------- */
$('aux').addEventListener('click',e=>{
  const s=e.target.closest('[data-n]');
  if(s&&S.menu){pickMenu(s.dataset.n);render()}
});

/* ---------- render ---------- */
const ERR={syn:'Syntax ERROR',math:'Math ERROR'};
function render(){
  const modeName=S.mode==='comp'?'COMP':S.mode==='tbl'?'TABLE':'EQN';
  $('ind').innerHTML=(S.shift?'<b>S</b>':'')+(S.alpha?'<b>A</b>':'')+(S.pend?'<b>'+(S.pend==='sto'?'STO':'RCL')+'</b>':'')+
    '<span class="sp"></span>'+(S.vars.M!==0?'<span>M</span>':'')+'<span>'+modeName+'</span><span>'+({D:'DEG',R:'RAD',G:'GRA'})[S.ang]+'</span>';
  $('k-shift').classList.toggle('lit',S.shift);$('k-alpha').classList.toggle('lit',S.alpha);

  const aux=$('aux');let prompt=S.note,showCur=!S.done,showExpr=true;
  aux.hidden=true;aux.className='';
  if(S.menu){
    aux.hidden=false;aux.className='tall';
    aux.innerHTML='<div class="menu'+(S.menu===MENU.eqn?' one':'')+'">'+S.menu.map(it=>'<span data-n="'+it[0]+'" class="'+(it[2]?'':'off')+'">'+it[0]+':'+it[1]+'</span>').join('')+'</div>';
    $('prompt').textContent='';$('expr').hidden=true;$('res').hidden=true;return;
  }
  if(S.eqn){
    const q=S.eqn,d=EQ[q.type];
    aux.hidden=false;
    aux.innerHTML='<div class="form">'+d.name+': '+d.form+'</div><div class="coefs" style="grid-template-columns:repeat('+d.cols+',minmax(0,1fr))">'+
      d.lab.map((l,i)=>'<span class="'+(q.phase==='in'&&i===q.idx?'on':'')+'">'+l+'='+(q.vals[i]==null?'·':fmt(q.vals[i]))+'</span>').join('')+'</div>';
    if(q.phase==='in')prompt=d.lab[q.idx]+' = ?';
    else{const r=q.roots[q.ri];prompt=r.msg?'':r.name+' =';showCur=false}
  }
  if(S.tbl){
    const t=S.tbl;
    if(t.step<4)prompt=TB[t.step][0]+(t.step>0&&!S.tok.length?'  (mặc định '+TB[t.step][1]+')':'');
    else{
      prompt='f(X)='+draw(t.f,-1)+'   ·   bấm = để sửa';
      aux.hidden=false;aux.className='tall';showExpr=false;showCur=false;
      aux.innerHTML='<table class="tb"><thead><tr><th>X</th><th>f(X)</th></tr></thead><tbody>'+
        t.rows.map(([x,y])=>'<tr><td>'+fmt(x)+'</td><td>'+(y===null?'ERROR':fmt(y))+'</td></tr>').join('')+'</tbody></table>';
    }
  }
  let askVal;
  if(S.ask){
    const a=S.ask;
    if(a.phase==='in'){const v=a.vars[a.i];prompt=(a.kind==='solve'&&v===a.target?'Solve for ':'')+v+'?';askVal=S.vars[v]}
    else if(a.kind==='solve'&&!S.err)prompt=a.msg?'':a.target+'=      L−R='+fmt(a.lr);
  }
  $('prompt').innerHTML=prompt;

  const ex=$('expr');ex.hidden=!showExpr;
  ex.innerHTML=draw(S.tok,showCur?S.cur:-1);
  const c=ex.querySelector('.cur');
  if(c){const l=c.offsetLeft;if(l<ex.scrollLeft+6)ex.scrollLeft=Math.max(0,l-6);else if(l>ex.scrollLeft+ex.clientWidth-6)ex.scrollLeft=l-ex.clientWidth+6}
  else ex.scrollLeft=0;

  const rs=$('res');rs.hidden=!showExpr;rs.className='';
  if(S.err){rs.className='sm';rs.textContent=ERR[S.err]}
  else if(S.out){if(S.out.html!=null){rs.className=S.out.sm?'sm':'';rs.innerHTML=S.out.html}else rs.innerHTML=S.frac&&S.out.ex?S.out.ex:fmt(S.out.v)}
  else if(askVal!==undefined&&!S.tok.length)rs.innerHTML=fmt(askVal);
  else rs.innerHTML='';
}

S.tok=['R{','2','}','×','sin(','3','0',')','+','F{','3','|','4','}'];S.cur=S.tok.length;equals();
window.press=press;window.__S=S;
render();
})();
